name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate seed data
        run: npm run validate:json

      - name: Unit + integration tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build must succeed with NO external secrets — Groq/GitHub
          # calls are only made at request time, not at build time.
          NODE_ENV: production
